name: Validate mcp add option parsing

on:
  push:
    branches:
      - repro/mcp-add-missing-values
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run mcp add regression tests
        run: pnpm exec vitest run src/Cli.test.ts -t "mcp add"
      - name: Run complete test suite
        run: pnpm exec vitest run
      - name: Check TypeScript types
        run: pnpm check:types
