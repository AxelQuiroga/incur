name: Reproduce mcp add missing-value parsing

on:
  push:
    branches:
      - repro/mcp-add-missing-values
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated CLI reproduction
        run: pnpm exec tsx scripts/repro-mcp-add.mjs
